name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS aarch64 dmg
            args: '--target aarch64-apple-darwin --bundles dmg'
            rust_targets: aarch64-apple-darwin
            cache_key: macos-latest-aarch64-apple-darwin-release
          - platform: macos-latest
            label: macOS x86_64 dmg
            args: '--target x86_64-apple-darwin --bundles dmg'
            rust_targets: x86_64-apple-darwin
            cache_key: macos-latest-x86_64-apple-darwin-release
          - platform: macos-latest
            label: macOS aarch64 app
            args: '--target aarch64-apple-darwin --bundles app'
            rust_targets: aarch64-apple-darwin
            cache_key: macos-latest-aarch64-apple-darwin-release
          - platform: macos-latest
            label: macOS x86_64 app
            args: '--target x86_64-apple-darwin --bundles app'
            rust_targets: x86_64-apple-darwin
            cache_key: macos-latest-x86_64-apple-darwin-release
          - platform: ubuntu-24.04
            label: Linux AppImage
            args: '--bundles appimage --verbose'
            rust_targets: ''
            cache_key: ubuntu-24.04-release
          - platform: ubuntu-24.04
            label: Linux deb
            args: '--bundles deb'
            rust_targets: ''
            cache_key: ubuntu-24.04-release
          - platform: ubuntu-24.04
            label: Linux rpm
            args: '--bundles rpm --verbose'
            rust_targets: ''
            cache_key: ubuntu-24.04-release
          - platform: windows-latest
            label: Windows NSIS
            args: '--bundles nsis'
            rust_targets: ''
            cache_key: windows-latest-release

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.cache_key }}

      - run: npm ci

      - name: Extract linuxdeploy without FUSE
        if: contains(matrix.args, '--bundles appimage')
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x scripts/prepare-linuxdeploy.sh
          ./scripts/prepare-linuxdeploy.sh

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: v__VERSION__
          releaseName: vixl v__VERSION__
          releaseBody: |
            Alpha prerelease for vixl v__VERSION__. This is an early preview, not a stable release.

            Checksums (`SHA256SUMS.txt`, `SHA512SUMS.txt`) are attached after all platform builds finish.
            See CONTRIBUTING.md for how to verify downloads.
          releaseDraft: true
          prerelease: true
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

  checksums:
    name: Checksums and publish
    needs: publish-tauri
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: meta
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download assets and write checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vixl-release
          cd /tmp/vixl-release

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir . --pattern '*'

          rm -f SHA256SUMS.txt SHA512SUMS.txt

          mapfile -t files < <(find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA512SUMS.txt' | sed 's|^\./||' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found for $TAG" >&2
            exit 1
          fi

          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          sha512sum -- "${files[@]}" > SHA512SUMS.txt

          {
            echo "## vixl v${VERSION} (alpha)"
            echo
            echo "This is an alpha prerelease, not a stable release."
            echo
            echo "Installers and bundles for macOS, Linux, and Windows are attached below."
            echo
            echo "### Verify downloads"
            echo
            echo "1. Download the asset(s) you need and \`SHA256SUMS.txt\` (or \`SHA512SUMS.txt\`)."
            echo "2. From the download directory, run:"
            echo
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS.txt'
            echo '# or'
            echo 'sha512sum -c SHA512SUMS.txt'
            echo '```'
            echo
            echo "On macOS you can use \`shasum -a 256 -c SHA256SUMS.txt\`."
            echo
            echo "Only trust checksum files from this GitHub Release for tag \`${TAG}\`."
            echo
            echo "### Assets"
            echo
            for f in "${files[@]}"; do
              echo "- \`${f}\`"
            done
          } > RELEASE_NOTES.md

          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            SHA256SUMS.txt \
            SHA512SUMS.txt \
            --clobber

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --draft=false
