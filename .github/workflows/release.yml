name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS aarch64 dmg
            args: '--target aarch64-apple-darwin --bundles dmg'
            rust_targets: aarch64-apple-darwin
            cache_key: macos-latest-aarch64-apple-darwin-release
            artifact_globs: |
              **/bundle/dmg/*.dmg
          - platform: macos-latest
            label: macOS aarch64 app
            args: '--target aarch64-apple-darwin --bundles app'
            rust_targets: aarch64-apple-darwin
            cache_key: macos-latest-aarch64-apple-darwin-release
            artifact_globs: |
              **/bundle/macos/*.app.tar.gz
              **/bundle/macos/*.app.tar.gz.sig
          - platform: ubuntu-24.04
            label: Linux AppImage
            args: '--bundles appimage --verbose'
            rust_targets: ''
            cache_key: ubuntu-24.04-release
            artifact_globs: |
              **/bundle/appimage/*.AppImage
              **/bundle/appimage/*.AppImage.sig
          - platform: ubuntu-24.04
            label: Linux deb
            args: '--bundles deb'
            rust_targets: ''
            cache_key: ubuntu-24.04-release
            artifact_globs: |
              **/bundle/deb/*.deb
              **/bundle/deb/*.deb.sig
          - platform: ubuntu-24.04
            label: Linux rpm
            args: '--bundles rpm --verbose'
            rust_targets: ''
            cache_key: ubuntu-24.04-release
            artifact_globs: |
              **/bundle/rpm/*.rpm
              **/bundle/rpm/*.rpm.sig
          - platform: windows-latest
            label: Windows NSIS
            args: '--bundles nsis'
            rust_targets: ''
            cache_key: windows-latest-release
            artifact_globs: |
              **/bundle/nsis/*-setup.exe
              **/bundle/nsis/*-setup.exe.sig

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.cache_key }}

      - run: npm ci

      - name: Clear stale bundles
        shell: bash
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle

      - name: Extract linuxdeploy without FUSE
        if: contains(matrix.args, '--bundles appimage')
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x scripts/prepare-linuxdeploy.sh
          ./scripts/prepare-linuxdeploy.sh

      - name: Build bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: false

      - name: Upload signed bundles
        uses: actions/upload-artifact@v4
        with:
          name: signed-bundles-${{ strategy.job-index }}
          if-no-files-found: error
          path: ${{ matrix.artifact_globs }}

  checksums:
    name: Checksums and publish
    needs: publish-tauri
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Resolve release tag
        id: meta
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/vixl-artifacts
          merge-multiple: true

      - name: Assemble, checksum, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET_DIR: ${{ runner.temp }}/vixl-artifacts
        run: |
          chmod +x scripts/publish-github-release.sh
          ./scripts/publish-github-release.sh

  # Docs go live only after every installer job and the public release edit
  # have finished, so the site never advertises a version that is not out yet.
  build-docs:
    name: Build docs
    needs: [publish-tauri, checksums]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm --prefix docs ci

      - run: npm --prefix docs run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vuepress/dist

  deploy-docs:
    name: Deploy docs
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
