[package]
name = "app"
version = "0.1.0-alpha.2"
description = "Local-first BYOK Agents UI"
authors = ["Aidan Hibbard"]
license = "MIT"
repository = "https://github.com/vixl-ai/vixl"
edition = "2021"
rust-version = "1.77.2"
# Required when the `cef` feature enables extra bins (helper / spike validate).
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = "0.12"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "process", "io-util", "net", "rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
open = "5"
lazy_static = "1"
portable-pty = "0.9"
notify = "7.0"
base64 = "0.22"
url = "2"
similar = "2"
flate2 = "1.1.9"
tar = "0.4.46"
which = "8.0.5"
sha2 = "0.10.9"
cef = { version = "151", default-features = false, optional = true }
cef-dll-sys = { version = "151", default-features = false, optional = true }

[features]
default = ["cef"]
cef = ["dep:cef", "dep:cef-dll-sys"]
# Dev-only spike validator; not enabled by release `--features cef`.
cef-spike = ["cef"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSDate", "NSRunLoop", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView", "NSApplication", "NSRunningApplication", "NSEvent", "NSColor"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }

[[bin]]
name = "vixl_cef_helper"
path = "src/bin/vixl_cef_helper.rs"
required-features = ["cef"]

[[bin]]
name = "cef-spike-validate"
path = "src/bin/cef-spike-validate.rs"
required-features = ["cef-spike"]

[[test]]
name = "commands_shell"
path = "../spec/src-tauri/commands/shell.rs"

[[test]]
name = "commands_sandbox"
path = "../spec/src-tauri/commands/sandbox.rs"

[[test]]
name = "commands_fs"
path = "../spec/src-tauri/commands/fs.rs"

[[test]]
name = "commands_git"
path = "../spec/src-tauri/commands/git.rs"

[[test]]
name = "commands_http"
path = "../spec/src-tauri/commands/http.rs"

[[test]]
name = "commands_web_fetch"
path = "../spec/src-tauri/commands/web_fetch.rs"

[[test]]
name = "commands_keychain"
path = "../spec/src-tauri/commands/keychain.rs"

[[test]]
name = "commands_lsp"
path = "../spec/src-tauri/commands/lsp.rs"

[[test]]
name = "commands_lsp_registry"
path = "../spec/src-tauri/commands/lsp_registry.rs"

[[test]]
name = "commands_mcp"
path = "../spec/src-tauri/commands/mcp.rs"

[[test]]
name = "commands_codegraph"
path = "../spec/src-tauri/commands/codegraph.rs"
